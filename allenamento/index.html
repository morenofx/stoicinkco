<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Allenamento</title>
<meta name="theme-color" content="#0b0b0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestra">
<style>
  :root{
    --bg:#0b0b0a; --card:#161513; --card2:#211f1b;
    --cream:#F5E6C8; --dim:rgba(245,230,200,.62); --line:rgba(245,230,200,.16);
    --ok:#9bd17a; --warn:#e8a25c; --body:#d98b5b; --body2:#8d5a3e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--cream)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35;
    min-height:100dvh;overscroll-behavior-y:contain}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  input{font-size:17px}
  .hidden{display:none!important}
  .scr{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:560px;margin:0 auto}

  /* disegni delle macchine */
  .m .fr{stroke:var(--cream);stroke-width:4;fill:none}
  .m .th{stroke-width:1.6}
  .m .pd{fill:var(--cream);stroke:none}
  .m .gr{stroke:var(--line);stroke-width:2}
  .m .ps{stroke:var(--body);fill:none}
  .m .pb{stroke:var(--body2);fill:none}
  .m .hd{fill:var(--body)}
  .m .ar .fr{stroke:var(--ok)} .m .ar .pd{fill:var(--ok)}

  /* barra in alto */
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .bar h1{font-size:1.5rem;font-weight:800;flex:1}
  .bar h2{font-size:1.2rem;font-weight:800;flex:1;text-align:center}
  .round{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);font-size:1.4rem;display:grid;place-items:center;flex:none}
  .round.spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hint{color:var(--dim);margin-bottom:12px}

  /* home */
  .day{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .day b{display:block;font-size:1.35rem}
  .day small{color:var(--dim);font-size:.95rem}
  .strip{display:flex;gap:6px;margin:12px 0;overflow:hidden}
  .strip svg,.strip img{width:64px;height:46px;flex:none;background:var(--card2);border-radius:8px;object-fit:cover}
  .go{display:block;text-align:center;background:var(--cream);color:var(--bg);font-weight:800;font-size:1.15rem;border-radius:12px;padding:14px}
  .oggi{font-size:1.15rem;font-weight:700;margin-bottom:10px}
  .riposo{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
  .riposo b{display:block;font-size:1.35rem;margin-bottom:4px}
  .riposo span{color:var(--dim)} .riposo span b{display:inline;font-size:1rem;color:var(--cream)}
  .sez{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:20px 0 8px}
  .week{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .wd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
  .wd:first-child{border-top:0}
  .wd span{width:118px;color:var(--dim)} .wd span small{opacity:.7}
  .wd b{flex:1;font-weight:600}
  .wd i{font-style:normal;color:var(--ok);font-weight:800}
  .wd{width:100%;text-align:left}
  .wd em{font-style:normal;font-size:1.3rem;opacity:.6}
  .meal{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:6px}
  .meal b{display:block;font-size:1.1rem;margin-bottom:6px}
  .meal span{display:block;font-size:.95rem;margin-top:4px}
  .meal i{font-style:normal;color:var(--dim);display:inline-block;width:56px}
  .meal em{display:block;font-style:normal;color:var(--dim);font-size:.9rem;margin-top:8px}
  .mm{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);line-height:1.35}
  .mm:first-child{border-top:0}
  .mm .ic{font-size:1.4rem}
  .mm small{color:var(--dim)}
  .chk{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
  .chk:first-child{border-top:0}
  .chk input{width:26px;height:26px;flex:none;accent-color:#9bd17a}
  .chk b{display:block;font-weight:600}
  .chk small{color:var(--dim)}
  .chk.on b{text-decoration:line-through;opacity:.55}
  a.btn{text-decoration:none;color:inherit}
  .prevrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .prevrow .th{width:64px;height:46px;flex:none;background:var(--card2);border-radius:8px;overflow:hidden;display:grid;place-items:center}
  .prevrow .th svg,.prevrow .th img{width:100%;height:100%;object-fit:cover}
  .prevrow small{display:block;color:var(--dim)}
  .wd.oggi{background:var(--cream);color:var(--bg)} .wd.oggi span{color:rgba(11,11,10,.7);font-weight:700}
  .day.fatto .go{background:transparent;color:var(--ok);border:1px solid rgba(155,209,122,.4)}
  .btn{display:block;width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);text-align:center;font-size:1.05rem;margin-top:10px}
  .btn.main{background:var(--cream);color:var(--bg);border:0;font-weight:800}
  .btn.red{color:var(--warn);border-color:rgba(232,162,92,.35)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .note{color:var(--dim);font-size:.9rem;margin-top:12px}

  /* esercizio a tutto schermo */
  #play{display:flex;flex-direction:column;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 12px);max-width:560px;margin:0 auto}
  .prog{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;flex:1}
  .prog div{height:100%;background:var(--cream);transition:width .3s}
  .clock{color:var(--dim);font-size:.9rem;margin:-8px 0 10px}
  .count{font-weight:700;color:var(--dim);min-width:52px;text-align:right}
  .pic{background:repeating-linear-gradient(45deg,rgba(245,230,200,.035) 0 1px,transparent 1px 7px),var(--card);border:1px solid var(--line);
    border-radius:18px;padding:10px;display:grid;place-items:center;flex:1 1 auto;min-height:170px;max-height:38vh;position:relative}
  .pic svg{width:100%;height:100%;max-height:calc(38vh - 20px)}
  .pic img{width:100%;height:100%;max-height:calc(38vh - 20px);object-fit:contain;border-radius:10px}
  .pic .info{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-weight:800}
  .pic .swap{position:absolute;left:8px;bottom:8px;height:36px;padding:0 12px;border-radius:18px;background:rgba(11,11,10,.8);border:1px solid var(--line);font-weight:700;font-size:.9rem}
  .pic .fase{position:absolute;left:8px;top:8px;padding:3px 10px;border-radius:12px;background:rgba(11,11,10,.75);font-size:.8rem;color:var(--dim)}
  .pic.web{padding:0;overflow:hidden;background:#000}
  .pic.web img{max-height:38vh;border-radius:0}
  .kind{color:var(--dim);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;margin-top:12px}
  .exname{font-size:1.65rem;font-weight:800;line-height:1.15;margin-top:2px}
  .how{color:var(--dim);font-size:.95rem;margin-top:6px}
  .target{font-size:1.25rem;margin-top:10px}
  .target b{font-size:1.5rem}
  .kg{display:flex;align-items:center;gap:10px;margin-top:10px}
  .kg button{width:56px;height:56px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:1.6rem}
  .kg span{font-size:1.8rem;font-weight:800;min-width:96px;text-align:center}
  .dots{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .dots button{width:30px;height:30px;border-radius:50%;border:2px solid var(--dim)}
  .dots button.on{background:var(--ok);border-color:var(--ok)}
  .do{margin-top:14px;width:100%;min-height:68px;border-radius:18px;background:var(--cream);color:var(--bg);font-size:1.3rem;font-weight:800}
  .do.next{background:var(--ok)}
  .nav{display:flex;gap:12px;margin-top:12px}
  .nav button{flex:1;height:60px;border-radius:16px;border:1px solid var(--line);font-size:1.15rem;font-weight:700}
  .nav button:disabled{opacity:.3}

  /* recupero a tutto schermo */
  #rest{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
  #rest .lbl{font-size:1.3rem;color:var(--dim)}
  #rest .t{font-size:6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  #rest .nx{color:var(--dim);font-size:1.05rem;max-width:320px}
  #rest .nx b{color:var(--cream)}
  #rest.end{background:#1d2a16}
  #rest .acts{display:flex;gap:12px;width:100%;max-width:360px}
  #rest .acts button{flex:1;height:60px;border-radius:16px;border:1px solid var(--line);font-size:1.1rem;font-weight:700}
  #rest .acts .skip{background:var(--cream);color:var(--bg);border:0}

  /* fine */
  .fine{text-align:center;padding-top:16vh}
  .fine .big{font-size:4rem}
  .fine h2{font-size:1.8rem;margin:10px 0}
  .fine p{color:var(--dim);font-size:1.1rem}

  /* scheda: modifica */
  .pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:none;padding:10px 16px;border:1px solid var(--line);border-radius:999px;color:var(--dim);white-space:nowrap}
  .pill.on{background:var(--cream);color:var(--bg);border-color:var(--cream);font-weight:800}
  .exrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
  .exrow .th{width:76px;height:54px;flex:none;background:var(--card2);border-radius:10px;overflow:hidden;display:grid;place-items:center}
  .exrow .th svg,.exrow .th img{width:100%;height:100%;object-fit:cover}
  .exrow .tx{flex:1;min-width:0;text-align:left}
  .exrow .tx b{display:block;font-size:1rem}
  .exrow .tx small{color:var(--dim)}
  .exrow .mv{display:flex;flex-direction:column;gap:4px}
  .exrow .mv button{width:40px;height:30px;border-radius:8px;border:1px solid var(--line);font-size:.9rem}
  .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--card2);font-size:.85rem;font-weight:800;flex:none}

  /* scelta macchina */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 10px;text-align:center}
  .tile svg{width:100%;height:auto;display:block;margin-bottom:6px}
  .tile b{font-size:.95rem;line-height:1.2;display:block}
  .tile.foto{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.2rem;gap:8px}
  .tile.foto b{font-size:.95rem}

  /* modifica esercizio */
  .bigpic{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:12px;display:grid;place-items:center}
  .bigpic svg{width:100%;height:auto;max-height:30vh}
  .bigpic img{width:100%;max-height:30vh;object-fit:contain;border-radius:10px}
  .field{display:block;margin-bottom:12px}
  .field span{display:block;color:var(--dim);font-size:.9rem;margin-bottom:4px}
  .field input{width:100%;height:54px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:0 14px;outline:0}
  .step{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:8px}
  .step span{color:var(--dim)}
  .step .ctl{display:flex;align-items:center;gap:6px}
  .step .ctl button{width:52px;height:52px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:1.5rem}
  .step .ctl b{min-width:78px;text-align:center;font-size:1.3rem}

  /* finestrella in basso */
  .sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:flex;align-items:flex-end}
  .sheet > div{width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:85dvh;overflow:auto}
  .sheet h3{font-size:1.25rem;margin-bottom:6px}
  .sheet p{color:var(--dim);margin-bottom:6px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom));z-index:60;
    background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:12px 20px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}
  .hist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .hist h3{font-size:1.05rem;margin-bottom:4px}
  .hist li{list-style:none;padding:5px 0;border-top:1px solid var(--line);font-size:.95rem}
  .hist li span{color:var(--dim)}
</style>
</head>
<body>

<section id="home" class="scr"></section>
<section id="play" class="hidden"></section>
<section id="edit" class="scr hidden"></section>
<section id="pick" class="scr hidden"></section>
<section id="exedit" class="scr hidden"></section>
<section id="storico" class="scr hidden"></section>
<section id="altro" class="scr hidden"></section>
<section id="mangia" class="scr hidden"></section>
<section id="spesa" class="scr hidden"></section>

<div id="rest" class="hidden"></div>
<div id="sheet" class="sheet hidden"></div>
<div class="toast" id="toast"></div>
<input type="file" id="cam" accept="image/*" class="hidden">
<input type="file" id="impf" accept="application/json,.json" class="hidden">

<script src="attrezzi.js?v=2.8"></script>
<script>
(() => {
  const KEY = 'palestra.v1';
  const APP_VER = '2.8';
  const $ = s => document.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const fmtDate = iso => new Date(iso + 'T12:00').toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtRest = s => s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : `${s} sec`;

  /* ---------- SCHEDA DI PARTENZA ---------- */
  // full body per rimettersi in forma e dimagrire: pesi 3 volte a settimana (A e B alternati), cardio nei giorni in mezzo.
  // role dice che posto ha il giorno nella settimana (A, B, C = solo cardio, D = domenica: camminata tranquilla). PLAN sale quando cambia la scheda consigliata.
  const PLAN = 4;
  const ex = (name, sets, reps, weight, rest, att, unit) => ({ id: uid(), name, sets, reps, weight, rest, ...(att ? { att } : {}), ...(unit ? { unit } : {}) });
  const CARDIO_DAY = () => ({ id: uid(), name: 'Solo cardio', role: 'C', exercises: [
    ex('Tapis roulant in salita', 1, 20, 0, 0, 'tapis', 'min'),
    ex('Cyclette', 1, 15, 0, 0, 'cyclette', 'min') ] });
  const EASY_DAY = () => ({ id: uid(), name: 'Camminata tranquilla', role: 'D', exercises: [
    ex('Camminata tranquilla', 1, 30, 0, 0, 'tapis', 'min') ] });
  const PLAN_DAYS = () => [
    { id: uid(), name: 'Allenamento A', role: 'A', exercises: [
      ex('Riscaldamento cyclette', 1, 8, 0, 0, 'cyclette', 'min'),
      ex('Leg press', 3, 12, 0, 90, 'legpress'),
      ex('Chest press', 3, 12, 0, 90, 'chestpress'),
      ex('Lat machine', 3, 12, 0, 90, 'lat'),
      ex('Leg curl', 3, 12, 0, 60, 'legcurl'),
      ex('Alzate laterali', 2, 15, 0, 45, 'manubri'),
      ex('Plank', 3, 30, 0, 45, 'tappetino', 'sec'),
      ex('Tapis roulant in salita', 1, 15, 0, 0, 'tapis', 'min') ] },
    { id: uid(), name: 'Allenamento B', role: 'B', exercises: [
      ex('Riscaldamento tapis roulant', 1, 8, 0, 0, 'tapis', 'min'),
      ex('Goblet squat', 3, 12, 0, 90, 'kettlebell'),
      ex('Pulley basso', 3, 12, 0, 90, 'pulley'),
      ex('Panca inclinata manubri', 3, 12, 0, 90, 'inclinata'),
      ex('Shoulder press', 3, 12, 0, 60, 'shoulder'),
      ex('Leg extension', 2, 15, 0, 60, 'legext'),
      ex('Crunch', 3, 15, 0, 45, 'tappetino'),
      ex('Ellittica', 1, 15, 0, 0, 'ellittica', 'min') ] },
    CARDIO_DAY(),
    EASY_DAY()
  ];
  const DEFAULT = () => ({ planVer: PLAN, days: PLAN_DAYS(), log: {} });

  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || DEFAULT(); } catch { S = DEFAULT(); }
  if (!S.days || !S.days.length) S = DEFAULT();
  S.log ||= {};
  if ((S.planVer || 1) < 2) { S.days = Object.keys(S.log).length ? [...PLAN_DAYS(), ...S.days] : PLAN_DAYS(); S.planVer = PLAN; }
  // i nomi vecchi "A · Full body" diventano "Allenamento A"
  for (const d of S.days) { const m = /^([A-Z]) · Full body$/.exec(d.name); if (m) d.name = 'Allenamento ' + m[1]; delete d.note; }
  // dalla 3: i giorni A e B prendono il loro posto nella settimana e arriva "Solo cardio" (scheda e pesi restano)
  if (S.planVer < 3) {
    for (const d of S.days) { const m = /^Allenamento ([AB])$/.exec(d.name); if (m && !S.days.some(x => x.role === m[1])) d.role = m[1]; }
    if (!S.days.some(d => d.role === 'C')) S.days.push(CARDIO_DAY());
    S.planVer = 3;
  }
  // dalla 4: la domenica camminata tranquilla per non perdere il ritmo; A e B stanno in un'ora (va alle 6 per un'oretta):
  // il cardio finale passa da 20 a 15 minuti se non l'ha gia' cambiato lui
  if (S.planVer < 4) {
    if (!S.days.some(d => d.role === 'D')) S.days.push(EASY_DAY());
    for (const d of S.days) if (d.role === 'A' || d.role === 'B') {
      const last = d.exercises[d.exercises.length - 1];
      if (last && last.unit === 'min' && last.reps === 20) last.reps = 15;
    }
    S.planVer = 4;
  }

  /* ---------- SETTIMANA ---------- */
  // lun A, mer B, ven A; la settimana dopo B, A, B. Mar, gio, sab solo cardio; domenica camminata tranquilla.
  const DAY_MS = 864e5;
  const isoOf = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
  const dateOf = iso => new Date(iso + 'T12:00');
  const dow = iso => (dateOf(iso).getDay() + 6) % 7;  // 0 = lunedi'
  const mondayOf = iso => isoOf(dateOf(iso).getTime() - dow(iso) * DAY_MS);
  // la prima settimana parte dal lunedi' di questa settimana (di domenica: da domani)
  if (!S.weekStart) { const t = todayISO(); S.weekStart = dow(t) === 6 ? isoOf(dateOf(t).getTime() + DAY_MS) : mondayOf(t); }
  function roleOn(iso) {
    const w = Math.round((dateOf(mondayOf(iso)) - dateOf(S.weekStart)) / (7 * DAY_MS)), odd = ((w % 2) + 2) % 2 === 1;
    return [odd ? 'B' : 'A', 'C', odd ? 'A' : 'B', 'C', odd ? 'B' : 'A', 'C', 'D'][dow(iso)];
  }
  const dayForRole = r => r && S.days.find(d => d.role === r);
  const doneOn = (iso, d) => !!S.log[iso] && d.exercises.some(e => S.log[iso][e.id]);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  const unitOf = e => e.unit || 'rip';
  const unitWord = (e, n) => ({ rip: n === 1 ? 'ripetizione' : 'ripetizioni', sec: 'secondi', min: 'minuti' })[unitOf(e)];
  const usesKg = e => unitOf(e) === 'rip' || +e.weight > 0;
  const attOf = e => (e.att && ATTREZZI.byId(e.att)) ? e.att : ATTREZZI.byExercise(e.name);
  const findEx = id => { for (const d of S.days) { const e = d.exercises.find(x => x.id === id); if (e) return e; } };
  const dayOf = id => S.days.find(d => d.id === id);
  const doneSets = exId => ((S.log[todayISO()] || {})[exId] || { sets: [] }).sets;

  /* ---------- FOTO (restano sul telefono) ---------- */
  const FOTO = (() => {
    let dbp;
    const db = () => dbp ||= new Promise((res, rej) => {
      const r = indexedDB.open('palestra', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('foto');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    const run = async (mode, fn) => {
      const d = await db();
      return new Promise((res, rej) => { const t = d.transaction('foto', mode), r = fn(t.objectStore('foto')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); });
    };
    return {
      get: id => run('readonly', st => st.get(id)), put: (id, v) => run('readwrite', st => st.put(v, id)),
      del: id => run('readwrite', st => st.delete(id)), clear: () => run('readwrite', st => st.clear()),
      all: async () => { const k = await run('readonly', st => st.getAllKeys()), v = await run('readonly', st => st.getAll()); return Object.fromEntries(k.map((x, i) => [x, v[i]])); }
    };
  })();
  const fotoMem = {};
  const fotoURL = async id => fotoMem[id] ??= await FOTO.get(id).catch(() => null);
  const fillFoto = root => root.querySelectorAll('img[data-fimg]').forEach(img => fotoURL(img.dataset.fimg).then(u => { if (u) img.src = u; }));
  // disegno o foto di un esercizio
  const picOf = e => e.foto ? `<img data-fimg="${e.id}" alt="">` : (attOf(e) ? ATTREZZI.svg(attOf(e)) : '<span style="font-size:2rem">🏋️</span>');
  function takePhoto(cb) {
    const inp = $('#cam'); inp.value = '';
    inp.onchange = () => {
      const file = inp.files[0]; if (!file) return;
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        cb(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = () => { URL.revokeObjectURL(url); alert('Non riesco a leggere questa foto.'); };
      img.src = url;

  }

  /* ---------- SCHERMATE ---------- */
  const SCREENS = ['home', 'play', 'edit', 'pick', 'exedit', 'storico', 'altro', 'mangia', 'spesa'];
  function go(name) {

  }
  let toastT;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1800); }

  /* ---------- HOME ---------- */
  function dayCard(d) {
    const done = d.exercises.length && d.exercises.every(e => doneSets(e.id).length >= e.sets);
    const min = Math.round(d.exercises.reduce((t, e) => t + (unitOf(e) === 'min' ? e.reps : e.sets * (1 + e.rest / 60)), 0) / 5) * 5;
    return `<button class="day ${done ? 'fatto' : ''}" data-start="${d.id}">
      <b>${esc(d.name)}</b><small>${d.exercises.length} ${d.exercises.length === 1 ? 'esercizio' : 'esercizi'} · circa ${min || 5} minuti</small>

  }
  const GIORNI = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
  function renderHome() {
    const t = todayISO(), rOggi = roleOn(t), dOggi = dayForRole(rOggi);
    const hasPlan = ['A', 'B', 'C'].every(r => dayForRole(r));
    let h = `<div class="bar"><h1>Allenamento</h1><button class="round" id="upd" aria-label="Aggiorna l'app">↻</button></div>`;
    if (hasPlan) {
      h += `<p class="oggi">Oggi, ${GIORNI[dow(t)].toLowerCase()} ${dateOf(t).getDate()} ${dateOf(t).toLocaleDateString('it-IT', { month: 'long' })}</p>`;
      if (rOggi === 'D') {
        const dom = dayForRole(roleOn(isoOf(dateOf(t).getTime() + DAY_MS)));
        h += `<div class="riposo"><b>🚶 Oggi camminata tranquilla</b><span>Niente pesi: 30 minuti a passo leggero, per non perdere il ritmo. Devi riuscire a parlare senza fiatone.${dom ? ` Domani: <b>${esc(dom.name)}</b>.` : ''}</span></div>`;
      }
      if (dOggi) h += dayCard(dOggi);
      h += mealCard(t);
      h += `<h3 class="sez">I prossimi giorni</h3><div class="week">`;

        const iso = isoOf(dateOf(t).getTime() + i * DAY_MS), d = dayForRole(roleOn(iso));
        const quando = i === 0 ? 'Oggi' : i === 1 ? 'Domani' : GIORNI[dow(iso)];
        h += `<button class="wd ${i === 0 ? 'oggi' : ''}" ${d ? `data-prev="${d.id}" data-quando="${quando} ${dateOf(iso).getDate()}"` : ''}><span>${quando} <small>${dateOf(iso).getDate()}</small></span>
          <b>${d ? esc(d.name) : 'Riposo'}</b>${d && doneOn(iso, d) ? '<i>✓</i>' : ''}${d ? '<em>›</em>' : ''}</button>`;

      h += `<p class="hint">Scegli l'allenamento di oggi e tocca <b>Inizia</b>.</p>` + S.days.map(dayCard).join('') + mealCard(t);
    }
    h += `<div class="row2"><button class="btn" data-go="mangia">🍽 Menu settimana</button><button class="btn" data-go="spesa">🛒 Lista spesa</button></div>
      <button class="btn" data-go="edit">✎ Crea o cambia la mia scheda</button>
      <div class="row2"><button class="btn" data-go="storico">📈 Storico</button><button class="btn" data-go="altro">💾 Backup</button></div>`;
    $('#home').innerHTML = h;
    fillFoto($('#home'));
    $('#upd').onclick = aggiorna;
  }

  /* ---------- ALLENAMENTO A TUTTO SCHERMO ---------- */
  let PL = null, wake = null;
  function start(dayId) {
    const d = dayOf(dayId); if (!d.exercises.length) { toast('Questo allenamento è vuoto'); return; }
    // riparte dal primo esercizio non ancora finito oggi
    let i = d.exercises.findIndex(e => doneSets(e.id).length < e.sets); if (i < 0) i = 0;
    PL = { day: dayId, i, start: Date.now(), info: false };
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w => wake = w).catch(() => {});
    go('play'); renderPlay();
  }
  function stopPlay() { if (PL) clearInterval(PL.anim); PL = null; if (wake) { wake.release().catch(() => {}); wake = null; } go('home'); }
  function renderPlay() {
    const d = dayOf(PL.day), list = d.exercises;
    if (PL.i >= list.length) return renderFine();
    const e = list[PL.i], done = doneSets(e.id), att = attOf(e), A = att && ATTREZZI.byId(att), u = unitOf(e);
    const all = done.length >= e.sets, cardio = u === 'min';
    const tot = list.reduce((t, x) => t + x.sets, 0), fatti = list.reduce((t, x) => t + Math.min(x.sets, doneSets(x.id).length), 0);
    // cosa mostrare: foto mia, foto vera dell'esercizio, disegno. Si parte dalla foto vera se c'e'.
    const web = ATTREZZI.fotoEs ? ATTREZZI.fotoEs(e.name) : null;
    const views = [e.foto && 'mia', web && 'web', att && 'dis'].filter(Boolean);
    if (!views.includes(PL.view)) PL.view = views.includes('web') ? 'web' : views[0];
    const view = PL.view;
    const picHtml = view === 'web' ? `<img id="webf" src="${web[0]}" alt="Foto dell'esercizio"><span class="fase" id="fase">Partenza</span>`
      : view === 'mia' ? `<img data-fimg="${e.id}" alt="">` : view === 'dis' ? ATTREZZI.svg(att) : picOf(e);
    const kind = cardio ? (PL.i === 0 && list.length > 2 ? 'Riscaldamento' : 'Cardio') : (A ? A.cat[0] : 'Esercizio');
    let main;
    if (all) main = `<button class="do next" id="avanti">${PL.i === list.length - 1 ? '🏁 Finisci l\'allenamento' : 'Avanti: esercizio dopo →'}</button>`;
    else if (cardio) main = `<button class="do" id="fatto">▶ Avvia ${e.reps} minuti</button>`;
    else main = `<button class="do" id="fatto">✓ Ho fatto la serie ${done.length + 1} di ${e.sets}</button>`;
    $('#play').innerHTML = `
      <div class="bar"><button class="round" id="esci" aria-label="Esci">✕</button><div class="prog"><div style="width:${tot ? fatti / tot * 100 : 0}%"></div></div>
        <span class="count">${PL.i + 1} / ${list.length}</span></div>
      <div class="clock" id="clock"></div>
      <div class="pic ${view === 'web' ? 'web' : ''}">${picHtml}${views.length > 1 ? `<button class="swap" id="swap">${VIEW_LBL[views[(views.indexOf(view) + 1) % views.length]]}</button>` : ''}${A ? '<button class="info" id="info" aria-label="Come si usa">i</button>' : ''}</div>
      <div class="kind">${esc(kind)}</div>
      <div class="exname">${esc(e.name)}</div>
      ${PL.info && A ? `<p class="how">${esc(A.come)}</p>` : ''}
      <div class="target">${cardio ? `<b>${e.reps}</b> minuti` : `<b>${e.sets}</b> serie da <b>${e.reps}</b> ${unitWord(e, e.reps)}`}</div>
      ${usesKg(e) && !cardio ? `<div class="kg"><button data-kg="-2.5" aria-label="Meno peso">−</button><span>${e.weight} kg</span><button data-kg="2.5" aria-label="Più peso">+</button></div>` : ''}
      ${e.sets > 1 ? `<div class="dots">${Array.from({ length: e.sets }, (_, k) => `<button class="${k < done.length ? 'on' : ''}" data-dot="${k}" aria-label="Serie ${k + 1}"></button>`).join('')}</div>` : ''}

    fillFoto($('#play'));
    // la foto vera alterna partenza e arrivo, come un piccolo video
    clearInterval(PL.anim);
    if (view === 'web') {
      let k = 0;
      PL.anim = setInterval(() => { const im = $('#webf'), fa = $('#fase'); if (!im) return clearInterval(PL.anim); k = 1 - k; im.src = web[k]; fa.textContent = k ? 'Arrivo' : 'Partenza'; }, 1400);
    }
    tickClock();
    if ($('#swap')) $('#swap').onclick = () => { PL.view = views[(views.indexOf(view) + 1) % views.length]; renderPlay(); };
    $('#esci').onclick = () => { if (confirm('Uscire dall\'allenamento? Le serie fatte restano salvate.')) stopPlay(); };
    $('#prev').onclick = () => move(-1);
    $('#next').onclick = () => move(1);
    if ($('#info')) $('#info').onclick = () => { PL.info = !PL.info; renderPlay(); };
    if ($('#avanti')) $('#avanti').onclick = () => move(1);
    if ($('#fatto')) $('#fatto').onclick = () => cardio ? runTimer(e.reps * 60, 'Cardio: ' + e.name, () => logSet(e)) : logSet(e);
    $('#play').querySelectorAll('[data-kg]').forEach(b => b.onclick = () => { e.weight = Math.max(0, Math.round((+e.weight + +b.dataset.kg) * 10) / 10); save(); renderPlay(); });
    $('#play').querySelectorAll('[data-dot]').forEach(b => b.onclick = () => {
      const k = +b.dataset.dot;
      if (k < done.length) { if (confirm(`Togliere la serie ${k + 1}?`)) { unlogSet(e, k); renderPlay(); } }
    });
  }
  // da quanto si sta allenando e che ore sono (va alle 6 e ha un'ora)
  function tickClock() {
    const el = $('#clock'); if (!el || !PL) return;
    const m = Math.floor((Date.now() - PL.start) / 60000);
    el.textContent = `🕒 ${new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })} · in palestra da ${m} min`;
  }
  setInterval(tickClock, 20000);
  function move(step) { PL.i = Math.max(0, PL.i + step); PL.info = false; PL.view = null; renderPlay(); scrollTo(0, 0); }
  const VIEW_LBL = { web: '📷 Foto', dis: '✏️ Disegno', mia: '📱 La mia foto' };
  function logSet(e) {
    const log = (S.log[todayISO()] ||= {}), entry = (log[e.id] ||= { name: e.name, sets: [] });
    entry.name = e.name; entry.unit = unitOf(e);
    entry.sets.push({ reps: e.reps, weight: +e.weight || 0 });
    save();
    const d = dayOf(PL.day), last = entry.sets.length >= e.sets;
    if (last) PL.i++;  // finito questo esercizio: dietro al recupero c'e' gia' il prossimo
    renderPlay();
    const nx = d.exercises[PL.i];
    if (unitOf(e) !== 'min' && e.rest && !(last && !nx)) {
      runTimer(e.rest, 'Recupero', null, last ? (nx ? `Prossimo: <b>${esc(nx.name)}</b>` : '') : `Poi serie ${entry.sets.length + 1} di ${e.sets}`);
    }
  }
  function unlogSet(e, k) {
    const log = S.log[todayISO()]; if (!log || !log[e.id]) return;
    log[e.id].sets.splice(k, 1);
    if (!log[e.id].sets.length) delete log[e.id];
    if (!Object.keys(log).length) delete S.log[todayISO()];
    save();
  }
  function renderFine() {
    const d = dayOf(PL.day), min = Math.max(1, Math.round((Date.now() - PL.start) / 60000));
    const serie = d.exercises.reduce((t, x) => t + doneSets(x.id).length, 0);
    $('#play').innerHTML = `<div class="fine"><div class="big">💪</div><h2>Allenamento finito!</h2>
      <p>${serie} serie in ${min} minuti. Bravo.</p>
      <button class="do next" id="home2" style="margin-top:30px">Torna all'inizio</button></div>`;
    $('#home2').onclick = stopPlay;
  }
  // scorrere col dito: verso sinistra = avanti, verso destra = indietro
  let tx = null, ty = null;
  $('#play').addEventListener('touchstart', ev => { tx = ev.touches[0].clientX; ty = ev.touches[0].clientY; }, { passive: true });
  $('#play').addEventListener('touchend', ev => {
    if (tx == null || !PL) return;
    const dx = ev.changedTouches[0].clientX - tx, dy = ev.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      const n = dayOf(PL.day).exercises.length;
      if (dx < 0 && PL.i < n) move(1); else if (dx > 0 && PL.i > 0) move(-1);
    }
  });

  /* ---------- RECUPERO / TIMER ---------- */
  let tEnd = 0, tInt = null, tDone = null, actx = null;
  function beep() {
    try {
      actx ||= new (window.AudioContext || window.webkitAudioContext)();
      [0, .3, .6].forEach(off => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
        g.gain.setValueAtTime(.3, actx.currentTime + off); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + off + .22);
        o.start(actx.currentTime + off); o.stop(actx.currentTime + off + .22);
      });
    } catch {}
    if (navigator.vibrate) navigator.vibrate([300, 120, 300]);
  }
  function runTimer(sec, label, onDone, sub = '') {
    try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {}
    tEnd = Date.now() + sec * 1000; tDone = onDone;
    const r = $('#rest'); r.classList.remove('hidden', 'end');
    r.innerHTML = `<div class="lbl">${esc(label)}</div><div class="t" id="tt"></div><div class="nx">${sub}</div>
      <div class="acts"><button id="tplus">+15 sec</button><button class="skip" id="tskip">${onDone ? '✓ Finito' : 'Salta ›'}</button></div>`;
    $('#tplus').onclick = () => { tEnd += 15000; tick(); };
    $('#tskip').onclick = () => endTimer(true);

    setTimeout(() => { if (!tInt) $('#rest').classList.add('hidden'); }, 1500);
  }

  /* ---------- CREA / CAMBIA LA SCHEDA ---------- */

    if (!edDay || !dayOf(edDay)) edDay = S.days[0].id;
    const d = dayOf(edDay);

        <span class="mv"><button data-up="${i}" aria-label="Sposta su" ${i === 0 ? 'disabled' : ''}>▲</button><button data-dn="${i}" aria-label="Sposta giù" ${i === d.exercises.length - 1 ? 'disabled' : ''}>▼</button></span></div>`;
    });

    }

  /* scelta della macchina dal catalogo a disegni */
  let cat = 'Tutti';
  const CATS = ['Tutti', 'Cardio', 'Petto', 'Schiena', 'Spalle', 'Braccia', 'Gambe', 'Addome'];
  function renderPick() {
    const d = dayOf(edDay);
    let h = `<div class="bar"><button class="round" data-go="edit" aria-label="Indietro">‹</button><h2>Scegli la macchina</h2><span style="width:48px"></span></div>
      <p class="hint">Si aggiunge a <b>${esc(d.name)}</b>.</p>

      A.ex.map((x, i) => `<button class="btn" data-pickex="${i}">${esc(x[0])}</button>`).join('') +
      `<button class="btn" data-close>Annulla</button>`, el => {
        el.querySelectorAll('[data-pickex]').forEach(b => b.onclick = () => { closeSheet(); addFromCatalog(A, +b.dataset.pickex); });
      });
  });
  function addFromCatalog(A, i) {
    const [name, sets, reps, rest, unit] = A.ex[i], d = dayOf(edDay);
    const e = ex(name, sets, reps, 0, rest, A.id, unit);
    d.exercises.push(e); save();
    toast(`${name} aggiunto`);
    openExEdit(e.id);
  }

  /* modifica di un esercizio: numeri grandi con − e + */
  let EX = null;
  function openExEdit(id, startFoto) {
    const e = id ? findEx(id) : { name: '', sets: 3, reps: 12, weight: 0, rest: 90 };
    EX = { id, v: { name: e.name, sets: e.sets, reps: e.reps, weight: +e.weight || 0, rest: e.rest, unit: unitOf(e) }, foto: startFoto || null, had: !!e.foto, e };
    go('exedit'); renderExEdit();
  }
  function renderExEdit() {
    const { v, e } = EX, att = ATTREZZI.byExercise(v.name) || e.att;
    const pic = EX.foto ? `<img src="${EX.foto}" alt="">` : EX.had ? `<img data-fimg="${EX.id}" alt="">` : att ? ATTREZZI.svg(att) : '<span style="font-size:3rem;padding:20px">📷</span>';
    const repLbl = { rip: 'Ripetizioni', sec: 'Secondi', min: 'Minuti' }[v.unit];
    const stepRow = (k, lbl, val) => `<div class="step"><span>${lbl}</span><div class="ctl"><button data-st="${k}" data-d="-1">−</button><b>${val}</b><button data-st="${k}" data-d="1">+</button></div></div>`;
    $('#exedit').innerHTML = `<div class="bar"><button class="round" id="back" aria-label="Indietro">‹</button><h2>${EX.id ? 'Esercizio' : 'Nuovo esercizio'}</h2><span style="width:48px"></span></div>
      <div class="bigpic">${pic}</div>
      <label class="field"><span>Nome</span><input id="nm" value="${esc(v.name)}" placeholder="es. Panca piana" autocomplete="off"></label>
      ${v.unit === 'min' ? '' : stepRow('sets', 'Serie', v.sets)}
      ${stepRow('reps', repLbl, v.reps)}
      ${v.unit === 'min' ? '' : stepRow('weight', 'Peso', v.weight + ' kg')}
      ${v.unit === 'min' ? '' : stepRow('rest', 'Recupero', fmtRest(v.rest))}
      <button class="btn main" id="sv">Salva</button>
      <button class="btn" id="ph">📷 ${EX.foto || EX.had ? 'Cambia la foto' : 'Metti una foto della macchina'}</button>
      ${EX.id ? '<button class="btn red" id="del">🗑 Togli dalla scheda</button>' : ''}`;
    fillFoto($('#exedit'));
    const nm = $('#nm'); nm.oninput = () => { v.name = nm.value; };
    $('#exedit').querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
      const k = b.dataset.st, s = +b.dataset.d;
      const stepBy = { sets: 1, reps: v.unit === 'sec' ? 5 : 1, weight: 2.5, rest: 15 }[k];
      v[k] = Math.max(k === 'sets' || k === 'reps' ? 1 : 0, Math.round((v[k] + s * stepBy) * 10) / 10);
      renderExEdit();
    });
    $('#back').onclick = () => go('edit');
    $('#ph').onclick = () => takePhoto(url => { EX.foto = url; renderExEdit(); });
    if ($('#del')) $('#del').onclick = () => {
      if (!confirm(`Togliere "${EX.e.name}" dalla scheda? Lo storico resta.`)) return;
      for (const d of S.days) d.exercises = d.exercises.filter(x => x.id !== EX.id);
      if (EX.had) FOTO.del(EX.id).catch(() => {});
      save(); go('edit');
    };
    $('#sv').onclick = async () => {
      const clean = { name: v.name.trim() || 'Esercizio', sets: v.sets, reps: v.reps, weight: v.weight, rest: v.rest };
      const a = ATTREZZI.byExercise(clean.name); if (a) clean.att = a;
      let item;
      if (EX.id) item = Object.assign(findEx(EX.id), clean);
      else { item = { id: uid(), ...clean }; dayOf(edDay).exercises.push(item); }
      if (EX.foto) {
        try { await FOTO.put(item.id, EX.foto); item.foto = true; fotoMem[item.id] = EX.foto; }
        catch { alert('Non riesco a salvare la foto su questo telefono: l\'esercizio è salvato senza.'); }
      }
      save(); toast('Salvato'); go('edit');
    };
  }

  /* ---------- COSA MANGIO ---------- */
  // Menu sui piatti surgelati di prepmymeal.it (sezione "Perdita di peso", letti il 26 ott 2026): 6 piatti sotto le
  // 550 kcal con 43-56 g di proteine, 2 volte a settimana ciascuno = 12 pasti; box da 24 ogni 2 settimane.
  // Le altre 2 cene sono "cene facili" fatte in casa. Calorie a porzione dalle schede del sito.
  const COLAZIONE = 'Yogurt greco magro + 4-5 cucchiai di fiocchi d\'avena + 1 frutto + 10 mandorle';
  const CENA_FACILE = ['Cena facile: 2 uova strapazzate o 1 scatoletta di tonno al naturale', 'mezza busta di verdure surgelate', '2 gallette integrali'];
  const MENU = [  // 0 = lunedi'
    { p: ['Pollo con mix di verdure e formaggio'], pk: 504, c: ['Pa Naeng thailandese con petto di pollo'], ck: 449 },
    { p: ['Bowl di pollo e patate dolci'], pk: 520, c: CENA_FACILE, ck: 400 },
    { p: ['Pollo gratinato al formaggio'], pk: 488, c: ['Pollo con crema di funghi'], ck: 483 },
    { p: ['Pollo al cocco con purè di patate'], pk: 465, c: CENA_FACILE, ck: 400 },
    { p: ['Pollo con mix di verdure e formaggio'], pk: 504, c: ['Pa Naeng thailandese con petto di pollo'], ck: 449 },
    { p: ['Bowl di pollo e patate dolci'], pk: 520, c: ['Pollo con crema di funghi'], ck: 483 },
    { p: ['Pollo gratinato al formaggio'], pk: 488, c: ['Pollo al cocco con purè di patate'], ck: 465 }
  ];
  // [chiave, nome sul sito, quante porzioni nella box da 24, prezzo a porzione nella box da 24]
  const SPESA_PMM = [
    ['pmm-verdure', 'Pollo con mix di verdure e formaggio', 4, 5.20], ['pmm-panaeng', 'Pa Naeng thailandese con petto di pollo', 4, 5.20],
    ['pmm-patate', 'Bowl di pollo e patate dolci', 4, 5.20], ['pmm-gratinato', 'Pollo gratinato al formaggio', 4, 5.20],
    ['pmm-funghi', 'Pollo con crema di funghi', 4, 5.20], ['pmm-cocco', 'Pollo al cocco con purè di patate', 4, 5.20]
  ];
  const SPEDIZIONE_PMM = 5.99;
  // ogni settimana, spesa online: verdure e cose per le 2 cene facili
  const SPESA_VERDURE = [
    ['v-verdure', 'Verdure surgelate (fagiolini, spinaci o miste)', '2 buste'], ['v-uova', 'Uova', '6'],
    ['v-tonno', 'Tonno al naturale', '2 scatolette'], ['v-gallette', 'Gallette integrali', '1 confezione']
  ];
  const SPESA_CASA = [
    ['c-yogurt', 'Yogurt greco magro 0% da 170 g', '7 vasetti'], ['c-avena', 'Fiocchi d\'avena', '1 pacco da 500 g (dura 2 settimane)'],
    ['c-mandorle', 'Mandorle al naturale, non salate', '1 busta da 250 g'], ['c-mele', 'Mele', '7'], ['c-banane', 'Banane', '7'],
    ['c-arance', 'Arance o kiwi', '7'], ['c-acqua', 'Acqua', '2 litri al giorno']
  ];
  const fmtEuro = n => n.toFixed(2).replace('.', ',') + ' €';
  const MOMENTI = d => [
    ['☀️', 'Colazione', 'dopo la palestra', COLAZIONE],
    ['🍎', 'Metà mattina', '', '1 frutto'],
    ['🍽', 'Pranzo', `circa ${d.pk} kcal`, d.p.join(' + ')],
    ['🥜', 'Pomeriggio', '', '1 frutto + 15 mandorle'],
    ['🌙', 'Cena', `circa ${d.ck} kcal`, d.c.join(' + ')]
  ];
  function mealCard(iso) {
    const d = MENU[dow(iso)];
    return `<button class="meal" data-go="mangia"><b>🍽 Oggi mangi</b>
      <span><i>Pranzo</i> ${esc(d.p.join(' + '))}</span><span><i>Cena</i> ${esc(d.c.join(' + '))}</span><em>Tutta la giornata ›</em></button>`;
  }
  let mDay = null;
  function renderMangia() {
    const t = todayISO();
    if (mDay == null) mDay = dow(t);
    const d = MENU[mDay];
    let h = `<div class="bar"><button class="round" data-go="home" aria-label="Indietro">‹</button><h2>Cosa mangio</h2><span style="width:48px"></span></div>
      <div class="pills">${GIORNI.map((g, i) => `<button class="pill ${i === mDay ? 'on' : ''}" data-md="${i}">${i === dow(t) ? 'Oggi' : g.slice(0, 3)}</button>`).join('')}</div>
      <div class="week">`;
    for (const [ic, nome, nota, cosa] of MOMENTI(d)) h += `<div class="mm"><span class="ic">${ic}</span><span><b>${nome}</b>${nota ? ` <small>${nota}</small>` : ''}<br>${esc(cosa)}</span></div>`;
    h += `</div>
      <p class="note">Piatti Prepmymeal: la sera prima sposta dal freezer al frigo quelli del giorno dopo, così bastano 3-4 minuti di microonde (da surgelati 7-9). La verdura in più è libera. Acqua: 2 litri al giorno. Dolci e alcol solo ogni tanto.</p>
      <button class="btn main" data-go="spesa">🛒 Lista della spesa</button>`;
    $('#mangia').innerHTML = h;
    $('#mangia').querySelectorAll('[data-md]').forEach(b => b.onclick = () => { mDay = +b.dataset.md; renderMangia(); });
  }
  function renderSpesa() {
    S.spesa ||= {};
    const tot = SPESA_PMM.reduce((t, x) => t + x[2] * x[3], 0) + SPEDIZIONE_PMM;
    const row = (k, nome, qta, extra) => `<label class="chk ${S.spesa[k] ? 'on' : ''}"><input type="checkbox" data-sp="${k}" ${S.spesa[k] ? 'checked' : ''}>
      <span><b>${esc(nome)}</b><small>${esc(qta)}${extra ? ' · ' + extra : ''}</small></span></label>`;
    let h = `<div class="bar"><button class="round" data-go="home" aria-label="Indietro">‹</button><h2>Lista spesa</h2><span style="width:48px"></span></div>
      <h3 class="sez">1 · Prepmymeal.it · ogni 2 settimane</h3>
      <p class="hint">Una <b>box da 24</b>: i pranzi e 5 cene per 2 settimane. Circa <b>${fmtEuro(tot)}</b> con la spedizione, cioè circa ${fmtEuro(tot / 2)} a settimana. Arriva il mercoledì, surgelata.</p>
      <div class="week">${SPESA_PMM.map(([k, n, q, pr]) => row(k, n, `${q} porzioni`, fmtEuro(q * pr))).join('')}</div>
      <p class="note">Nel carrello controlla l'abbonamento: se vuoi ordinare a mano, lascialo spento. Si conservano 6 mesi nel freezer.</p>
      <a class="btn" href="https://prepmymeal.it/products/box-da-6-pasti-perdita-di-peso" target="_blank" rel="noopener">Apri Prepmymeal.it ↗</a>
      <h3 class="sez">2 · Spesa online · ogni settimana</h3>
      <p class="hint">Colazioni, spuntini e le 2 cene facili. Ordinala da casa (per esempio Esselunga a casa o Amazon): così non vai al supermercato e non compri schifezze.</p>
      <div class="week">${[...SPESA_VERDURE, ...SPESA_CASA].map(([k, n, q]) => row(k, n, q)).join('')}</div>
      <button class="btn red" id="sprst">Togli tutte le spunte (nuova settimana)</button>
      <p class="note">Piatti e prezzi presi dal sito il 26 ottobre: se un piatto manca, scegline uno simile nella sezione "Perdita di peso", sotto le 550 calorie.</p>`;
    $('#spesa').innerHTML = h;
    $('#spesa').querySelectorAll('[data-sp]').forEach(c => c.onchange = () => { S.spesa[c.dataset.sp] = c.checked; c.closest('.chk').classList.toggle('on', c.checked); save(); });
    $('#sprst').onclick = () => { if (confirm('Togliere tutte le spunte?')) { S.spesa = {}; save(); renderSpesa(); } };
  }

  /* ---------- STORICO ---------- */
  function renderStorico() {
    const dates = Object.keys(S.log).sort().reverse();
    let h = `<div class="bar"><button class="round" data-go="home" aria-label="Indietro">‹</button><h2>Storico</h2><span style="width:48px"></span></div>`;
    if (!dates.length) h += `<p class="hint">Ancora niente: le serie che segni compaiono qui.</p>`;
    for (const d of dates) {
      h += `<div class="hist"><h3>${fmtDate(d)}</h3><ul>` + Object.values(S.log[d]).map(e =>
        `<li>${esc(e.name)}<br><span>${e.sets.map(s => e.unit === 'min' ? `${s.reps} min` : e.unit === 'sec' ? `${s.reps} sec` : `${s.weight} kg × ${s.reps}`).join(' · ')}</span></li>`).join('') + '</ul></div>';
    }
    $('#storico').innerHTML = h;
  }

  /* ---------- BACKUP E AGGIORNAMENTO ---------- */
  function renderAltro() {
    $('#altro').innerHTML = `<div class="bar"><button class="round" data-go="home" aria-label="Indietro">‹</button><h2>Backup</h2><span style="width:48px"></span></div>
      <p class="hint">Scheda, storico e foto restano solo su questo telefono. Salva un backup ogni tanto: se cambi telefono o cancelli i dati di Safari, lo recuperi.</p>
      <button class="btn main" id="exp">⬇︎ Salva un backup</button>
      <button class="btn" id="imp">⬆︎ Ripristina un backup</button>
      <button class="btn red" id="reset">Ricomincia da zero</button>
      <p class="note">Foto degli esercizi: free-exercise-db, pubblico dominio.</p>
      <p class="note">Versione ${APP_VER}. Per l'ultima versione tocca ↻ nella prima pagina: non serve rimettere l'app sulla schermata Home.</p>`;
    $('#exp').onclick = async () => {
      let fotos = {}; try { fotos = await FOTO.all(); } catch {}
      const blob = new Blob([JSON.stringify({ ...S, fotos })], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `allenamento-backup-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    $('#imp').onclick = () => $('#impf').click();
    $('#reset').onclick = async () => {
      if (!confirm('Cancellare scheda, storico e foto da questo telefono?') || !confirm('Sicuro? Senza backup non si recupera.')) return;
      try { await FOTO.clear(); } catch {}
      for (const k in fotoMem) delete fotoMem[k];
      S = DEFAULT(); save(); go('home');
    };
  }
  $('#impf').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!Array.isArray(d.days) || typeof d.log !== 'object') throw 0;
      if (!confirm('Sostituire i dati attuali con quelli del backup?')) return;
      const fotos = d.fotos || {}; delete d.fotos;
      try { await FOTO.clear(); for (const [k, v] of Object.entries(fotos)) await FOTO.put(k, v); } catch {}
      for (const k in fotoMem) delete fotoMem[k];
      S = d; save(); go('home'); alert('Backup ripristinato.');
    } catch { alert('Questo file non è un backup valido.'); }
    ev.target.value = '';
  };
  // scarica di nuovo l'app senza toccare scheda, storico e foto
  async function aggiorna() {
    const b = $('#upd'); b.classList.add('spin');
    try {
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
      const keys = (await caches.keys()).filter(k => k.startsWith('allenamento-'));
      for (const f of ['./', './index.html', document.querySelector('script[src^="attrezzi.js"]').getAttribute('src'), './manifest.json']) {
        const r = await fetch(f, { cache: 'reload' }); if (!r.ok) throw 0;
        for (const k of keys) await (await caches.open(k)).put(f, r.clone());
      }
      location.reload();
    } catch { b.classList.remove('spin'); toast('Serve la connessione per aggiornare'); }
  }

  /* ---------- FINESTRELLA ---------- */
  function sheet(html, bind) {
    const s = $('#sheet'); s.innerHTML = `<div>${html}</div>`; s.classList.remove('hidden');
    s.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
    s.onclick = ev => { if (ev.target === s) closeSheet(); };
    bind && bind(s);
  }
  function closeSheet() { $('#sheet').classList.add('hidden'); }

  // toccando un giorno della settimana si vede la sua scheda
  function preview(dayId, quando) {
    const d = dayOf(dayId);
    sheet(`<h3>${esc(quando)}: ${esc(d.name)}</h3>` +
      d.exercises.map((e, i) => `<div class="prevrow"><span class="num">${i + 1}</span><span class="th">${picOf(e)}</span>
        <span><b>${esc(e.name)}</b><small>${unitOf(e) === 'min' ? `${e.reps} minuti` : `${e.sets} serie × ${e.reps}${unitOf(e) === 'sec' ? ' secondi' : ''}${usesKg(e) && +e.weight ? ` · ${e.weight} kg` : ''}`}</small></span></div>`).join('') +
      `<button class="btn main" data-startp="${d.id}">▶ Inizia</button><button class="btn" data-close>Chiudi</button>`, el => {
        fillFoto(el);
        el.querySelector('[data-startp]').onclick = () => { closeSheet(); start(d.id); };
      });
  }

  /* ---------- AVVIO ---------- */
  document.addEventListener('click', ev => {
    const pv = ev.target.closest('[data-prev]'); if (pv) return preview(pv.dataset.prev, pv.dataset.quando);
    const g = ev.target.closest('[data-go]'); if (g) return go(g.dataset.go);
    const s = ev.target.closest('[data-start]'); if (s) return start(s.dataset.start);
  });
  save(); go('home');
  let lastDate = todayISO();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && todayISO() !== lastDate && !PL) { lastDate = todayISO(); go('home'); } });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
    navigator.serviceWorker.ready.then(() => {
      if (!navigator.onLine) return;
      const urls = new Set(S.days.flatMap(d => d.exercises.flatMap(e => (ATTREZZI.fotoEs && ATTREZZI.fotoEs(e.name)) || [])));
      urls.forEach(u => fetch(u).catch(() => {}));
    });
  }
})();
</script>
</body>
</html>
